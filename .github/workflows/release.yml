name: Release

# Two ways to release version X.Y.Z (after updating the sketch and CHANGELOG.md):
#   - push a tag vX.Y.Z from a terminal, or
#   - on GitHub: Actions -> Release -> Run workflow, enter X.Y.Z.
#     The workflow then creates the tag on the current master commit.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$version\" is not a MAJOR.MINOR.PATCH version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Check that the version matches the sketch
        run: |
          sketch="$(sed -n 's/^#define VFD_INITIALIZE_VERSION "\(.*\)"/\1/p' vfd_initialize/vfd_initialize.ino)"
          echo "Release: $VERSION, sketch: $sketch"
          if [ "$VERSION" != "$sketch" ]; then
            echo "::error::$TAG does not match VFD_INITIALIZE_VERSION \"$sketch\""
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          # Creates the tag on this commit if it does not exist yet.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
