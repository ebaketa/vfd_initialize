name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the sketch version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^#define VFD_INITIALIZE_VERSION "\(.*\)"/\1/p' vfd_initialize/vfd_initialize.ino)"
          echo "Tag: $tag, sketch: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match VFD_INITIALIZE_VERSION \"$version\""
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $tag"
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
